[project]
name = "pullback"
version = "0.1.0"
description = "An agent that finds out whether something in your home has been recalled, then gets the remedy delivered."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.55",
    "strands-agents-tools",
    "anthropic>=0.40",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
