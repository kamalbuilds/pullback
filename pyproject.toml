[project]
name = "pullback"
version = "0.1.0"
description = "An agent that finds out whether something in your home has been recalled, then gets the remedy delivered."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.55",
    "strands-agents-tools",
    "anthropic>=0.40",
    "boto3>=1.35",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Semantic candidate retrieval. Optional because it pulls torch and downloads a
# 130MB embedding model, and a judge cloning this repo should get a working
# suite without either. Without it the pass uses lexical candidates only.
retrieval = ["sentence-transformers>=3.0", "torch>=2.4", "numpy>=1.26"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
